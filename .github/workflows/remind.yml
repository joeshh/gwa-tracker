name: Class reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: class-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send reminders
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node remind.mjs

      - name: Save what was already sent
        run: |
          if [ -n "$(git status --porcelain reminder-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reminder-state.json
            git commit -m "Update reminder state"
            git push
          fi
